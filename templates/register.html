<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | NewFlow</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/newflow-favicon.png') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- LOGO -->

            <a
                href="{{ url_for('home') }}"
                class="logo"
            >
                <span>New</span>Flow
            </a>


            <!-- BOTÃO VOLTAR -->

            <a
                href="{{ url_for('home') }}"
                class="back-link"
            >
                ← Voltar para o NewFlow
            </a>


            <h1>
                Crie sua conta
            </h1>

            <p class="subtitle">
                Comece a descobrir músicas que combinam com você.
            </p>


            {% if erro %}

                <div class="error-message">
                    {{ erro }}
                </div>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <p class="auth-link">

                Já possui uma conta?

                <a
                    href="{{ url_for('auth.login') }}"
                >
                    Entrar
                </a>

            </p>

        </section>

    </main>

</body>

</html>
