<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | NewFlow</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="logo">
                <span>New</span>Flow
            </div>

            <h1>Bem-vindo de volta</h1>

            <p class="subtitle">
                Entre na sua conta e descubra novas músicas.
            </p>

            {% if erro %}
                <div class="error-message">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p class="auth-link">
                Ainda não possui uma conta?

                <a href="{{ url_for('auth.register') }}">
                    Criar conta
                </a>
            </p>

        </section>

    </main>

</body>

</html>
